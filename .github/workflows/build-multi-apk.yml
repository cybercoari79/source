name: build-multi-apk

on:
  workflow_dispatch:
    inputs:
      base_apk:
        description: 'APK base'
        required: true
        type: choice
        options:
          - vip.apk
          - vip-teste2.apk
      app_name:
        description: 'Nome do app'
        required: true
        type: string
      credential:
        description: 'Credencial (opcional)'
        required: false
        type: string
        default: ''
      new_package:
        description: 'Novo pacote (opcional)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK e Build-Tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0'

      - name: Download Apktool
        run: |
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

      - name: Obter APK base
        run: |
          set -euo pipefail
          mkdir -p work
          cp "APKs/${{ inputs.base_apk }}" work/base.apk

      - name: Descompilar APK
        run: |
          java -jar apktool.jar d "work/base.apk" -o work/decoded -f

      - name: Modificar APK (Nome, Credencial, Pacote)
        env:
          APP_NAME: ${{ inputs.app_name }}
          CREDENTIAL: ${{ inputs.credential }}
          NEW_PACKAGE: ${{ inputs.new_package }}
        run: |
          set -euo pipefail
          
          if [ -f "work/decoded/res/values/strings.xml" ]; then
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" work/decoded/res/values/strings.xml
          fi

          if [ -n "$NEW_PACKAGE" ]; then
            OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' work/decoded/AndroidManifest.xml || true)
            if [ -n "$OLD_PACKAGE" ]; then
              sed -i "s|package=\"$OLD_PACKAGE\"|package=\"$NEW_PACKAGE\"|g" work/decoded/AndroidManifest.xml
              if [ -d "work/decoded/smali" ]; then
                find work/decoded/smali -type f -name "*.smali" -exec sed -i "s|$OLD_PACKAGE|$NEW_PACKAGE|g" {} +
              fi
            fi
          fi

          if [ -n "$CREDENTIAL" ]; then
            mkdir -p work/decoded/assets/config
            echo "$CREDENTIAL" > work/decoded/assets/config/credential.txt
          fi

      - name: Recompilar APK
        run: |
          java -jar apktool.jar b work/decoded -o work/unsigned.apk

      - name: Assinar e Alinhar APK (Nativo)
        run: |
          # Gera a keystore
          keytool -genkey -v -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mykey -storepass password -keypass password -dname "CN=Android Debug,O=Android,C=US" || true
          
          # O zipalign do Android SDK
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 work/unsigned.apk work/aligned.apk
          
          # O apksigner do Android SDK
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks keystore.jks --ks-pass pass:password --key-pass pass:password --out work/atx-signed.apk work/aligned.apk

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: multi-apk
          path: work/atx-signed.apk
          retention-days: 7