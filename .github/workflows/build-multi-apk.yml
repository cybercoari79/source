name: build-multi-apk

on:
  workflow_dispatch:
    inputs:
      base_apk:
        description: 'APK base'
        required: true
        type: choice
        options:
          - vip.apk
          - vip-teste2.apk
      app_name:
        description: 'Nome do app'
        required: true
        type: string
      credential:
        description: 'Credencial (opcional)'
        required: false
        type: string
        default: ''
      new_package:
        description: 'Novo pacote (opcional)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Apktool e Uber APK Signer
        run: |
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

      - name: Obter APK base
        run: |
          set -euo pipefail
          mkdir -p work
          cp "APKs/${{ inputs.base_apk }}" work/base.apk

      - name: Descompilar APK
        run: |
          java -jar apktool.jar d "work/base.apk" -o work/decoded -f

      - name: Modificar APK (Nome, Credencial, Pacote)
        env:
          APP_NAME: ${{ inputs.app_name }}
          CREDENTIAL: ${{ inputs.credential }}
          NEW_PACKAGE: ${{ inputs.new_package }}
        run: |
          set -euo pipefail
          
          # 1. Alterar o Nome do App
          if [ -f "work/decoded/res/values/strings.xml" ]; then
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" work/decoded/res/values/strings.xml
          else
            echo "Aviso: strings.xml não encontrado."
          fi

          # 2. Alterar o Pacote (se fornecido)
          if [ -n "$NEW_PACKAGE" ]; then
            echo "Alterando pacote para $NEW_PACKAGE"
            OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' work/decoded/AndroidManifest.xml || true)
            if [ -n "$OLD_PACKAGE" ]; then
              sed -i "s|package=\"$OLD_PACKAGE\"|package=\"$NEW_PACKAGE\"|g" work/decoded/AndroidManifest.xml
              if [ -d "work/decoded/smali" ]; then
                find work/decoded/smali -type f -name "*.smali" -exec sed -i "s|$OLD_PACKAGE|$NEW_PACKAGE|g" {} +
              fi
            fi
          fi

          # 3. Inserir Credencial
          if [ -n "$CREDENTIAL" ]; then
            echo "Inserindo credencial..."
            mkdir -p work/decoded/assets/config
            echo "$CREDENTIAL" > work/decoded/assets/config/credential.txt
          fi

      - name: Recompilar APK
        run: |
          java -jar apktool.jar b work/decoded -o work/unsigned.apk

      - name: Assinar e Alinhar APK
        run: |
          # O Uber Signer assina e alinha automaticamente
          java -jar uber-apk-signer.jar -a work/unsigned.apk --out work/
          
          # CORREÇÃO AQUI: O nome gerado pelo Uber Signer é unsigned-aligned-debugSigned.apk
          mv work/unsigned-aligned-debugSigned.apk work/atx-signed.apk

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: multi-apk
          path: work/atx-signed.apk
          retention-days: 7